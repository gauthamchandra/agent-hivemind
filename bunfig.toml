[test]
preload = ["./src/testing/setup.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
randomize = true

coverageExclude = [
  "**/*.test.ts",
]

include = [
  "src/**/*.test.ts",
]

[install]
frozenLockfile = false
cache = true

[build]
minify = false
sourcemap = "external"

exclude = [
  "**/*.test.ts",
  "**/*.test.js",
  "coverage/",
  "docs/",
  "*.md"
]
