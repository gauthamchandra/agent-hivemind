name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint --verbose

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          agent_signoff=0

          AGENT_SIGNOFF_EMAILS='cursoragent@cursor\.com|noreply@anthropic\.com|codex@openai\.com|devin@cognition\.ai|([^<>]*\+)?(copilot(\[bot\])?|copilot-swe-agent\[bot\]|devin-ai-integration\[bot\]|google-labs-jules\[bot\])@users\.noreply\.github\.com'
          HUMAN_IDENTITY='.+ <[^[:space:]>]+@[^>]+>'

          while read -r sha; do
            body="$(git show -s --format='%B' "$sha")"
            signoffs="$(printf '%s\n' "$body" | grep -iE '^Signed-off-by:' || true)"

            if printf '%s\n' "$signoffs" | grep -qiE "<($AGENT_SIGNOFF_EMAILS)>"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is signed off by a coding agent."
              agent_signoff=1
            fi

            author_email="$(git show -s --format='%ae' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"

            if printf '%s\n' "$author_email" | grep -qiE "^($AGENT_SIGNOFF_EMAILS)$"; then
              human_signoffs="$(printf '%s\n' "$signoffs" | grep -viE "<($AGENT_SIGNOFF_EMAILS)>" | grep -iE "^Signed-off-by: ${HUMAN_IDENTITY}$" || true)"
              if [ -z "$human_signoffs" ]; then
                echo "::error::$(git show -s --format='%h %s' "$sha") is agent-authored and lacks a human Signed-off-by."
                missing=1
              fi
              continue
            fi

            if printf '%s\n' "$author" | grep -qiE '\[bot\]'; then
              continue
            fi

            if ! printf '%s\n' "$signoffs" | grep -qiF "Signed-off-by: ${author}"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") lacks a Signed-off-by matching the author."
              missing=1
            fi
          done < <(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")

          if [ "$agent_signoff" -ne 0 ] || [ "$missing" -ne 0 ]; then
            exit 1
          fi

  quality:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
