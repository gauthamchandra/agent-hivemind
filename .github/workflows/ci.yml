name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint --verbose

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          agent_signoff=0

          AGENT_SIGNOFF_EMAILS='cursoragent@cursor\.com|noreply@anthropic\.com|codex@openai\.com|devin@cognition\.ai|([^<>]*\+)?(copilot(\[bot\])?|copilot-swe-agent\[bot\]|devin-ai-integration\[bot\]|google-labs-jules\[bot\])@users\.noreply\.github\.com'
          HUMAN_IDENTITY='.+ <[^[:space:]>]+@[^>]+>'

          while read -r sha; do
            body="$(git show -s --format='%B' "$sha")"
            signoffs="$(printf '%s\n' "$body" | grep -iE '^Signed-off-by:' || true)"

            if printf '%s\n' "$signoffs" | grep -qiE "<($AGENT_SIGNOFF_EMAILS)>"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is signed off by a coding agent."
              agent_signoff=1
            fi

            author_email="$(git show -s --format='%ae' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"

            if printf '%s\n' "$author_email" | grep -qiE "^($AGENT_SIGNOFF_EMAILS)$"; then
              human_signoffs="$(printf '%s\n' "$signoffs" | grep -viE "<($AGENT_SIGNOFF_EMAILS)>" | grep -iE "^Signed-off-by: ${HUMAN_IDENTITY}$" || true)"
              if [ -z "$human_signoffs" ]; then
                echo "::error::$(git show -s --format='%h %s' "$sha") is agent-authored and lacks a human Signed-off-by."
                missing=1
              fi
              continue
            fi

            # Only skip GitHub App bots (noreply addresses). A display name that
            # merely contains "[bot]" still needs a matching human Signed-off-by.
            if printf '%s\n' "$author_email" | grep -qiE '\[bot\]@users\.noreply\.github\.com$'; then
              continue
            fi

            if ! printf '%s\n' "$signoffs" | grep -qiF "Signed-off-by: ${author}"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") lacks a Signed-off-by matching the author."
              missing=1
            fi
          done < <(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")

          if [ "$agent_signoff" -ne 0 ] || [ "$missing" -ne 0 ]; then
            exit 1
          fi

  quality:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

  spawn-gate:
    name: Spawn gate on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: hivemind
          POSTGRES_PASSWORD: hivemind
          POSTGRES_DB: hivemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hivemind -d hivemind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Concurrent clients against a PostgreSQL server
        env:
          HIVEMIND_POSTGRES_URL: postgres://hivemind:hivemind@localhost:5432/hivemind
        run: bun test .postgres.test.ts
