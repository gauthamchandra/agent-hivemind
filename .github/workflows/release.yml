name: Release

on:
  push:
    branches: [main]

# The shared app token is what release-please uses. A push to main opens or
# updates the release pull request. Merging that pull request publishes the tag
# and the GitHub Release. This workflow's token does not need to write.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # Shared releaser app. Kinglet's release workflow mints its token from
      # RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY. This step uses that same app.
      # A push opens or updates the release pull request. Merging that pull
      # request is the run that tags the version and publishes the GitHub Release.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
